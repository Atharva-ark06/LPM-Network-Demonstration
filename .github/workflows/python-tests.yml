name: LPM simulator tests

on:
  push:
    branches:
      - master
      - "feat/**"
      - "docs/**"
      - "test/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python lpm_simulator.py --help
      - name: Run example lookup
        run: python lpm_simulator.py 10.0.1.200
